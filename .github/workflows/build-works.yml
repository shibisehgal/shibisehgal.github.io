name: Build Latest Works

# Mirrors the Google Drive folder into static HTML/images so they are
# crawlable (SEO) and self-hosted (reliable). Each run is a full re-sync:
# new images are added, deleted ones pruned, and replaced ones re-downloaded
# (detected by content hash). Use the force_resync input to overwrite all.

on:
  schedule:
    - cron: "0 * * * *"   # hourly — lower this (e.g. "0 */6 * * *") if you want fewer commits
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab
    inputs:
      force_resync:
        description: "Overwrite ALL images (full re-download, ignore cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-works
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Bake gallery
        run: npm run build
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          FORCE_RESYNC: ${{ inputs.force_resync }}

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/works index.html works/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Latest Works gallery [skip ci]"
            git push
          fi
